<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poster Generator</title>
  
  <!-- Cropper.js CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 450px;
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .preview-box {
      width: 100%;
      background: #090d16;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #334155;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-upload {
      background: #2563eb;
      color: white;
    }
    .btn-download {
      background: #16a34a;
      color: white;
    }
    .btn-share {
      background: #25d366;
      color: white;
    }

    /* Modal for Cropping */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-content {
      background: #1e293b;
      width: 100%;
      max-width: 450px;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .crop-container {
      width: 100%;
      max-height: 350px;
      margin-bottom: 15px;
      overflow: hidden;
      background: #000;
    }
    .crop-container img {
      max-width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="preview-box">
      <canvas id="posterCanvas"></canvas>
    </div>

    <div class="input-group">
      <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">
        📷 Select Photo
      </button>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="input-group">
      <label for="userName">പേര് (Name):</label>
      <input type="text" id="userName" placeholder="Enter your name..." />
    </div>

    <button class="btn btn-download" id="downloadBtn">📥 Download Poster</button>
    <button class="btn btn-share" id="shareBtn">🚀 Share</button>
  </div>

  <!-- Crop Modal -->
  <div class="modal" id="cropModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px;">Crop Photo</h3>
      <div class="crop-container">
        <img id="cropImage" src="" />
      </div>
      <button class="btn btn-upload" id="cropBtn">Apply Crop</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const userNameInput = document.getElementById('userName');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareBtn = document.getElementById('shareBtn');

    const cropModal = document.getElementById('cropModal');
    const cropImage = document.getElementById('cropImage');
    const cropBtn = document.getElementById('cropBtn');
    let cropper = null;

    let bgImage = new Image();
    let userPhoto = null;

    // Google Drive direct link fallback or local 1.png
    const DRIVE_IMAGE_URL = "https://drive.google.com/uc?export=download&id=14-mJHgu5Ur-cI0U0Dv497p98ZXdo4zFC";

    // Slot positions on the 1.png template (percentage relative to poster size)
    const SLOT = {
      xPercent: 0.505,    // Left position (~50.5%)
      yPercent: 0.533,    // Top position (~53.3%)
      widthPercent: 0.395, // Width (~39.5%)
      heightPercent: 0.355, // Height (~35.5%)
      borderRadius: 24
    };

    function init() {
      bgImage.crossOrigin = "anonymous";
      bgImage.src = "1.png"; // Local file 1.png

      bgImage.onload = () => {
        setupCanvas();
        renderPoster();
      };

      bgImage.onerror = () => {
        // Fallback to Google Drive URL if local 1.png is not found
        bgImage.src = DRIVE_IMAGE_URL;
      };
    }

    function setupCanvas() {
      canvas.width = bgImage.naturalWidth || 600;
      canvas.height = bgImage.naturalHeight || 750;
    }

    function renderPoster() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Background Image (1.png)
      ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

      // 2. Draw User Photo inside the slot area
      const x = canvas.width * SLOT.xPercent;
      const y = canvas.height * SLOT.yPercent;
      const w = canvas.width * SLOT.widthPercent;
      const h = canvas.height * SLOT.heightPercent;

      if (userPhoto) {
        ctx.save();
        // Clip rounded rectangle for the photo slot
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, SLOT.borderRadius);
        ctx.clip();

        ctx.drawImage(userPhoto, x, y, w, h);
        ctx.restore();
      }

      // 3. Draw User Name over the bottom of the photo slot
      const nameText = userNameInput.value.trim();
      if (nameText) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, SLOT.borderRadius);
        ctx.clip();

        const bannerHeight = h * 0.22;
        const bannerY = y + h - bannerHeight;

        // Banner background
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(x, bannerY, w, bannerHeight);

        // Name text
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `bold ${Math.round(bannerHeight * 0.45)}px sans-serif`;
        ctx.fillText(nameText, x + w / 2, bannerY + bannerHeight / 2, w - 10);

        ctx.restore();
      }
    }

    // Handle File Selection & Open Crop Modal
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          cropImage.src = event.target.result;
          cropModal.style.display = 'flex';

          if (cropper) cropper.destroy();
          
          const slotAspect = SLOT.widthPercent / SLOT.heightPercent;
          cropper = new Cropper(cropImage, {
            aspectRatio: slotAspect,
            viewMode: 1,
            autoCropArea: 1,
          });
        };
        reader.readAsDataURL(file);
      }
    });

    // Apply Crop
    cropBtn.addEventListener('click', () => {
      if (cropper) {
        const croppedCanvas = cropper.getCroppedCanvas({ width: 500, height: 500 });
        const img = new Image();
        img.onload = () => {
          userPhoto = img;
          cropModal.style.display = 'none';
          cropper.destroy();
          cropper = null;
          renderPoster();
        };
        img.src = croppedCanvas.toDataURL();
      }
    });

    // Name Input Event
    userNameInput.addEventListener('input', renderPoster);

    // Download Functionality
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'poster.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Share Functionality
    shareBtn.addEventListener('click', async () => {
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], 'poster.png', { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Campaign Poster',
              text: 'Check out my campaign poster!',
            });
          } catch (err) {
            console.log('Sharing canceled/failed:', err);
          }
        } else {
          alert('Sharing is not supported on this browser. Please download the image instead.');
        }
      });
    });

    // Run Initialization
    init();
  </script>
</body>
</html>
