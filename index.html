<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cropper.js CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        .modal-bg {
            background-color: rgba(0, 0, 0, 0.75);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 text-slate-800">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden my-4 border border-slate-200">
        
        <!-- Canvas Preview Area -->
        <div class="p-4 bg-slate-100 flex justify-center items-center border-b border-slate-200">
            <div class="relative w-full max-w-[340px] aspect-[1/1.25] shadow-lg rounded-xl overflow-hidden bg-slate-300 flex items-center justify-center">
                <canvas id="posterCanvas" class="w-full h-full block rounded-xl"></canvas>
            </div>
        </div>

        <!-- FORM STEP 1: Input Name & Select Photo -->
        <div id="stepInput" class="p-6 space-y-4">
            <div>
                <label for="userNameInput" class="block text-sm font-semibold text-slate-700 mb-1">
                    Name / പേര്
                </label>
                <input type="text" id="userNameInput" placeholder="Enter your name..." 
                    class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl text-slate-800 text-base focus:outline-none focus:border-blue-600 transition duration-200">
            </div>

            <button id="btnOpenModal" 
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-base shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-image"></i>
                <span>SELECT PHOTO & CROP</span>
            </button>
        </div>

        <!-- FORM STEP 2: Poster Actions -->
        <div id="stepSuccess" class="hidden p-6 space-y-3 bg-slate-50">
            <button id="btnDownload" 
                class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-download text-lg"></i>
                <span>Download Poster</span>
            </button>

            <button id="btnShareWA" 
                class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-xl shadow transition flex items-center justify-center space-x-2">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>Share to WhatsApp</span>
            </button>

            <button id="btnReset" 
                class="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Create Another Poster</span>
            </button>
        </div>
    </div>

    <!-- CROPPER MODAL -->
    <div id="cropModal" class="fixed inset-0 z-50 modal-bg flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="text-base font-bold text-slate-800">Select & Crop Photo</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 text-2xl leading-none font-bold">&times;</button>
            </div>

            <div class="p-3 border-b">
                <div class="flex border rounded-xl overflow-hidden">
                    <input type="text" id="fileNameDisplay" placeholder="No file selected..." readonly 
                        class="px-3 py-2 text-sm w-full bg-slate-50 text-slate-600 focus:outline-none">
                    <label class="bg-blue-600 hover:bg-blue-700 px-4 py-2 text-sm font-semibold text-white cursor-pointer flex items-center">
                        Browse
                        <input type="file" id="fileInput" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>

            <div class="p-3 flex-1 flex items-center justify-center overflow-hidden bg-slate-900 min-h-[260px] max-h-[380px]">
                <div id="cropAreaContainer" class="w-full h-full flex items-center justify-center">
                    <img id="imageToCrop" class="max-w-full max-h-full block" alt="Source image for cropping">
                </div>
            </div>

            <div class="p-4 bg-slate-50 border-t flex justify-end space-x-3">
                <button id="btnCancelCrop" 
                    class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl text-sm transition">
                    Cancel
                </button>
                <button id="btnCropApply" disabled 
                    class="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold rounded-xl text-sm transition">
                    Apply & Crop
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');
        
        const stepInput = document.getElementById('stepInput');
        const stepSuccess = document.getElementById('stepSuccess');
        const userNameInput = document.getElementById('userNameInput');
        
        const cropModal = document.getElementById('cropModal');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const imageToCrop = document.getElementById('imageToCrop');
        
        const btnOpenModal = document.getElementById('btnOpenModal');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnCancelCrop = document.getElementById('btnCancelCrop');
        const btnCropApply = document.getElementById('btnCropApply');
        
        const btnDownload = document.getElementById('btnDownload');
        const btnShareWA = document.getElementById('btnShareWA');
        const btnReset = document.getElementById('btnReset');

        let cropper = null;
        let basePosterImg = null;
        let croppedUserImg = null;
        let currentUserName = '';

        // Poster slot coordinates tailored for the campaign template slot
        let POSTER_WIDTH = 1000;
        let POSTER_HEIGHT = 1250;

        const SLOT = {
            x: 505,
            y: 540,
            w: 400,
            h: 480,
            radius: 40
        };

        window.onload = function() {
            loadBasePoster();
        };

        function loadBasePoster() {
            basePosterImg = new Image();
            basePosterImg.crossOrigin = "anonymous";
            
            // Try loading local 1.png first
            basePosterImg.src = '1.png';
            
            basePosterImg.onload = function() {
                POSTER_WIDTH = basePosterImg.naturalWidth || 1000;
                POSTER_HEIGHT = basePosterImg.naturalHeight || 1250;
                canvas.width = POSTER_WIDTH;
                canvas.height = POSTER_HEIGHT;
                renderPoster();
            };

            basePosterImg.onerror = function() {
                // Google Drive direct export fallback link if local 1.png is missing
                console.warn("1.png not found locally. Loading Google Drive fallback link...");
                basePosterImg.src = 'https://drive.google.com/uc?export=download&id=14-mJHgu5Ur-cI0U0Dv497p98ZXdo4zFC';
            };
        }

        function renderPoster() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw template background
            if (basePosterImg && basePosterImg.complete && basePosterImg.naturalWidth !== 0) {
                ctx.drawImage(basePosterImg, 0, 0, canvas.width, canvas.height);
            }

            // Draw cropped user photo inside the slot
            if (croppedUserImg) {
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(SLOT.x, SLOT.y, SLOT.w, SLOT.h, SLOT.radius);
                ctx.clip();
                ctx.drawImage(croppedUserImg, SLOT.x, SLOT.y, SLOT.w, SLOT.h);
                ctx.restore();
            }

            // Draw user name overlay
            if (currentUserName.trim() !== '') {
                ctx.save();
                const nameY = SLOT.y + SLOT.h - 60;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.beginPath();
                ctx.roundRect(SLOT.x + 4, nameY, SLOT.w - 8, 55, [0, 0, 25, 25]);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 30px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(currentUserName.trim(), SLOT.x + (SLOT.w / 2), nameY + 28);
                ctx.restore();
            }
        }

        btnOpenModal.addEventListener('click', () => {
            cropModal.classList.remove('hidden');
        });

        function closeModal() {
            cropModal.classList.add('hidden');
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            imageToCrop.src = '';
            fileInput.value = '';
            fileNameDisplay.value = 'No file selected...';
            btnCropApply.disabled = true;
        }

        btnCloseModal.addEventListener('click', closeModal);
        btnCancelCrop.addEventListener('click', closeModal);

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                fileNameDisplay.value = file.name;

                const reader = new FileReader();
                reader.onload = function(e) {
                    imageToCrop.src = e.target.result;
                    
                    if (cropper) {
                        cropper.destroy();
                    }

                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: SLOT.w / SLOT.h,
                        viewMode: 1,
                        background: true,
                        autoCropArea: 0.9,
                        responsive: true
                    });

                    btnCropApply.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        btnCropApply.addEventListener('click', () => {
            if (!cropper) return;

            const croppedCanvas = cropper.getCroppedCanvas({
                width: SLOT.w,
                height: SLOT.h,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            croppedUserImg = new Image();
            croppedUserImg.onload = function() {
                currentUserName = userNameInput.value;
                renderPoster();
                closeModal();
                
                stepInput.classList.add('hidden');
                stepSuccess.classList.remove('hidden');
            };
            croppedUserImg.src = croppedCanvas.toDataURL('image/png');
        });

        userNameInput.addEventListener('input', (e) => {
            currentUserName = e.target.value;
            renderPoster();
        });

        btnDownload.addEventListener('click', () => {
            const dataUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'Poster_Output.png';
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        btnShareWA.addEventListener('click', () => {
            const shareText = encodeURIComponent('Check out my poster!');
            window.open(`https://api.whatsapp.com/send?text=${shareText}`, '_blank');
        });

        btnReset.addEventListener('click', () => {
            croppedUserImg = null;
            currentUserName = '';
            userNameInput.value = '';
            renderPoster();
            stepSuccess.classList.add('hidden');
            stepInput.classList.remove('hidden');
        });
    </script>
</body>
</html>
